<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn – FeedSpace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="main/css/auth.css"/>
    <link rel="stylesheet" href="main/css/base.css" />
    <style>
      /* School ID Input Styling */
      .school-id-input {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
      }
      .school-id-helper {
        font-size: 0.8rem;
        color: var(--color-subtext);
        margin-top: 4px;
      }

      /* Password Toggle Styling */
      .password-input-wrapper {
        display: flex;
        align-items: center;
        border: 2px solid var(--color-border, #ddd);
        border-radius: 10px;
        background: var(--color-white, white);
      }
      .password-input-wrapper .form-input {
        flex: 1;
        border: none;
        padding: 11px 14px;
        background: transparent;
      }
      .toggle-password {
        background: var(--color-cream, #f8f9fa);
        border: none;
        color: var(--color-dark, #333);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 8px 12px;
        border-radius: 0 8px 8px 0;
        margin-left: -2px;
      }
      .toggle-password:hover {
        background: #e8f0f7;
      }
    </style> 
  </head>
  <body>
    <div class="MainContainer">
      <!-- Your leftside image container stays the same -->
      <div class="leftside">
        <div class="imgContainer">
        </div>
      </div>

      <div class="rightside">
        <a href="index.html" style="text-decoration: none; color: inherit">
<img src="main\assets\logo.png" alt="logo" class="sm-logo" />
        </a>
        <h1 class="title">Welcome To FeedSpace!</h1>
        <p class="subtitle">Where Ka-Piyu Connects!</p>

        <form action="" class="Loginform" id="loginOtpForm">
          <h1 class="form-head">Log In with OTP</h1>

          <!-- EMAIL -->
          <div class="inputContainer">
            <label for="loginEmail">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="xxxx-xxxx@lspu.edu.ph"
              autocomplete="email"
              required
            />
            <p id="loginOtpMessage" class="otp-message"></p>
          </div>

          <button type="button" class="signinBtn" id="sendOtpBtn" onclick="handleLoginOtpSend(event)">Send OTP</button>
        </form>


        <p>
          Don't have an account yet?
        <a href="main/html/signup.html" class="createacc">Create an Account</a> 
        </p>
      </div>
    </div>

    <script src="main/js/base.js"></script>
    <script src="main/js/auth.js"></script>
<script>
let __loginOtp = {
  userId: null,
  loading: false
};

function setLoginOtpMessage(message, success = false) {
  const el = document.getElementById('loginOtpMessage');
  if (!el) return;
  el.textContent = message || '';
  el.classList.toggle('success', success);
}

function showToast(msg) {
  alert(msg); // replace with your toast system if you have one
}

/* =========================
   SEND OTP
========================= */
window.handleLoginOtpSend = async function (event) {
  event?.preventDefault();

  if (__loginOtp.loading) return;

  const email = document.getElementById('loginEmail')?.value.trim();

  if (!email) return showToast('Enter your email');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    return showToast('Invalid email format');
  }

  __loginOtp.loading = true;

  const btn = document.getElementById('sendOtpBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = 'Sending...';
  }

  try {
    const res = await fetch('/login-main-feedspace/auth/login-otp.php', {
      method: 'POST',
      body: new URLSearchParams({ email }),
      credentials: 'include'
    });

    const data = await res.json();

    if (!data.success) throw new Error(data.message || 'OTP failed');

    __loginOtp.userId = data.user_id;

    setLoginOtpMessage('OTP sent!', true);

    // redirect to verify page
    window.location.href =
      `/login-main-feedspace/main/html/verify-account.html?user_id=${encodeURIComponent(data.user_id)}`;

  } catch (err) {
    showToast(err.message);
    setLoginOtpMessage(err.message, false);
  } finally {
    __loginOtp.loading = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = 'Send OTP';
    }
  }
};


/* =========================
   VERIFY OTP
========================= */
window.handleLoginOtpVerify = async function () {
  const inputs = document.querySelectorAll('.otp-input');
  const otp = Array.from(inputs).map(i => i.value).join('');

  if (!__loginOtp.userId) return showToast('Send OTP first');
  if (!/^\d{6}$/.test(otp)) return showToast('Enter 6-digit OTP');

  const verifyBtn = document.getElementById('verifyOtpBtn');
  if (verifyBtn) {
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = 'Verifying...';
  }

  try {
    const res = await fetch('/login-main-feedspace/auth/verify-otp.php', {
      method: 'POST',
      body: new URLSearchParams({
        user_id: __loginOtp.userId,
        otp_code: otp
      }),
      credentials: 'include'
    });

    const data = await res.json();

    if (!data.success) throw new Error(data.message || 'Invalid OTP');

    // IMPORTANT: session must be set in PHP here
    localStorage.setItem('user_id', data.user_id);

    showToast('Login successful');

    window.location.href =
      '/login-main-feedspace/main/html/feed-view.php';

  } catch (err) {
    showToast(err.message);
  } finally {
    if (verifyBtn) {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = 'Verify';
    }
  }
};
    </script>
  </body>
</html>
