/* ══ REDDIT-STYLE PROFILE HEADER ══ */
.profile-header {
  margin-bottom: 20px;
  background: var(--color-white);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.profile-banner {
  height: 160px;
  background: linear-gradient(135deg, #7AAACE 0%, #355872 100%);
  position: relative;
  cursor: pointer;
  background-size: cover;
  background-position: center;
}
.profile-banner:hover .banner-edit-hint { opacity: 1; }
.banner-edit-hint {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.28); color: #fff;
  font-size: 0.82rem; font-weight: 700; gap: 6px;
  opacity: 0; transition: opacity 0.2s;
}

.profile-info-row {
  display: flex; align-items: flex-end;
  gap: 14px; padding: 0 20px 18px 0;
}

.profile-avatar-wrap {
  position: relative; width: 90px; height: 90px;
  margin-left: 22px; margin-top: -45px; flex-shrink: 0; cursor: pointer;
}
.profile-avatar-wrap:hover .avatar-edit-overlay { opacity: 1; }
.profile-avatar {
  width: 90px; height: 90px; border-radius: 50%;
  border: 4px solid var(--color-white);
  object-fit: cover; display: block; background: #ccc;
}
.avatar-edit-overlay {
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(0,0,0,0.38);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1.1rem; opacity: 0;
  transition: opacity 0.2s;
  border: 4px solid var(--color-white); box-sizing: border-box;
}

.profile-text { flex: 1; padding-top: 10px; }
.profile-text h2 {
  margin: 0 0 2px; font-size: 1.2rem; font-weight: 800;
  color: var(--color-dark); display: flex; align-items: center; gap: 6px;
}
.verified-badge { color: #1da1f2; font-size: 0.95rem; }
.profile-username { font-size: 0.81rem; color: var(--color-subtext); margin-bottom: 7px; }
.profile-stats-row {
  display: flex; gap: 18px;
  font-size: 0.81rem; color: var(--color-subtext);
}
.profile-stats-row strong { color: var(--color-dark); font-weight: 800; }

.profile-actions {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 4px; flex-shrink: 0;
}
.profile-edit-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--color-dark);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-full); padding: 7px 16px;
  font-size: 0.83rem; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: background 0.18s, border-color 0.18s;
}
.profile-edit-btn:hover { background: var(--color-cream); border-color: var(--color-mid); }

.profile-follow-btn {

  background: var(--color-dark); color: var(--color-white);
  border: 2px solid transparent; border-radius: var(--radius-full);

}
.profile-follow-btn:hover { background: var(--color-mid); transform: translateY(-1px); }
.profile-follow-btn.following {

}
.profile-follow-btn.following:hover { background: var(--color-cream); border-color: var(--color-mid); }

/* ══ EDIT PROFILE MODAL ══ */
.ep-modal-overlay {

.ep-modal {

.spinner {
  width: 50px; height: 50px;

@keyframes spin {

.toast-message {

  animation: skeletonPulse 1.2s ease-in-out infinite;
  pointer-events: none;
  display: inline-block;
}
.skeleton-pulse * { visibility: hidden; }

<script>
// ── Post interaction helpers (called from profile.js–rendered HTML) ──

function toggleDropdown(id) {
  var dropdown = document.getElementById(id);
  if (dropdown) {
    document.querySelectorAll('.dropdown').forEach(function(d) {
      if (d.id !== id) d.classList.remove('show');
    });
    dropdown.classList.toggle('show');
  }
}

function togglePostOptions(btn) {
  var menu = btn.nextElementSibling;
  document.querySelectorAll('.post-options-menu').forEach(function(m) {
    if (m !== menu) m.classList.remove('show');
  });
  menu.classList.toggle('show');
}

function closeOptions(el) {
  el.closest('.post-options-menu').classList.remove('show');
}

function editPost(el) {
  var card = el.closest('.post-card');
  var body = card.querySelector('.post-body p');
  var current = body ? body.innerText : '';
  var newText = prompt('Edit your post:', current);
  if (newText !== null && newText.trim() !== '') {
    if (body) body.innerText = newText;
    showToast('Post updated!');
  }
  closeOptions(el);
}

function deletePost(el) {
  var card = el.closest('.post-card');
  if (confirm('Delete this post?')) {
    card.style.transition = 'opacity 0.28s, transform 0.28s';
    card.style.opacity = '0';
    card.style.transform = 'translateY(-8px)';
    setTimeout(function() { card.remove(); }, 290);
    showToast('Post deleted.');
  }
  closeOptions(el);
}

function archivePost(el) {
  el.closest('.post-card').style.opacity = '0.38';
  showToast('Post archived!');
  closeOptions(el);
}

function toggleComments(btn) {
  var card = btn.closest('.post-card');
  var section = card.querySelector('.comment-section');
  if (section) {
    var isHidden = section.style.display === 'none' || !section.style.display;
    section.style.display = isHidden ? 'block' : 'none';
  }
}

function openShareModal(btn) {
  // Profile page currently doesn't include a share modal DOM.
  // Make the share button functional by calling the share endpoint directly.
  const card = btn.closest('.post-card');
  const postId = card?.dataset?.postId;
  if (!postId) {
    showToast('Error: Post ID not found', 'error');
    return;
  }

  showToast('Sharing...');

  fetch('../api/users/interactions/share-post.php', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      post_id: parseInt(postId, 10),
      comment: ''
    })
  })
  .then(async r => {
    const raw = await r.text();
    try { return JSON.parse(raw); }
    catch { throw new Error('Invalid JSON from server'); }
  })
  .then(res => {
    if (!res?.success) throw new Error(res?.error || 'Share failed');
    showToast(res.message || 'Post shared!');
    setTimeout(() => window.location.reload(), 300);
  })
  .catch(err => {
    console.error('Share error:', err);
    showToast('Failed to share: ' + err.message, 'error');
  });
}



function addComment(btn, postId) {
  var input = btn.closest('.comment-input-wrap').querySelector('input');
  var comment = input.value.trim();
  if (comment) {
    showToast('Comment added!');
    input.value = '';
  }
}

function openReportModal(btn) {
  showToast('Report feature coming soon!');
  closeOptions(btn);
}

function confirmDelete() {
  if (confirm('Are you sure you want to delete your account? This cannot be undone!')) {
    showToast('Account deletion requested');
  }
}

// Close dropdowns/menus when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.post-card')) {
    document.querySelectorAll('.post-options-menu').forEach(function(m) {
      m.classList.remove('show');
    });
  }
  if (!e.target.closest('.nav-actions')) {
    document.querySelectorAll('.dropdown').forEach(function(d) {
      d.classList.remove('show');
    });
  }
});
</script>
